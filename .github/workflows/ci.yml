name: Zenith Shell CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Lint & Build Zenith Shell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check Nix Flake & Format
        run: |
          nix flake check --all-systems

      - name: QML & Python Linting Environment
        run: |
          nix shell nixpkgs#qt6.qtdeclarative nixpkgs#python3Packages.flake8 -c bash -c "
            echo '==> Running QML Lint...'
            qmllint \$(find . -name '*.qml')
            
            echo '==> Running Python Lint...'
            if find scripts/ -name '*.py' | grep -q .; then
              flake8 scripts/ --max-line-length=120 --ignore=E501,W503,E203
            fi
          "

      - name: Build Zenith Shell Package
        run: |
          nix build .#zenith-shell --print-build-logs
